# config.yaml for real data

# Set memory and threads for high demanding rules
high:
  mem_mb: 614400 # memory in MB
  t: 96 # number of threads

# Set memory and threads for medium demanding rules
medium:
  mem_mb: 614400 # memory in MB
  t: 64 # number of threads

# Set memory and threads for low demanding rules
low:
  mem_mb: 614400 # memory in MB
  t: 32 # number of threads

# Path to hifi reads
hifi_path: "data/raw_hifi/"

# Path to hic reads
hic_path: "data/raw_hic/"

# Customisable parameters for kmc
kmc:
  k: 21 # kmer size, it will be the same used for genomescope2
  ci: 2 # exclude k-mers occurring less than <value> times (default: 2)
  cs: 1000000 #maximal value of a counter (default: 255)

# Customisable parameters for kmc_tools transform
kmc_tools:
  cx: 1000000 # exclude k-mers occurring more of than <value> times

# Customisable parameters for genomescope2
genomescope2:
  optional_params:
    "-p": "4"
    "-l": ""

# Customisable parameters for oatk
oatk:
  k: 1001 # kmer size [1001]
  c: 150 #  minimum kmer coverage [3]
  m: "resources/oatkDB/embryophyta_mito.fam" # mitochondria gene annotation HMM profile database [NULL]
  optional_params: 
    "-p": "resources/oatkDB/embryophyta_pltd.fam" # to use for species that have a plastid db

# Customisable parameters for fastp
fastp:
  optional_params:
    "--cut_front": False # set to True for Arima Hi-C library prep kit generated data
    "--cut_front_window_size": "" # set to 5 for Arima Hi-C library prep kit generated data

# 下游组装链模式 (与 hifiasm 分相参数解耦):
#   primary = 坍缩组装单链 (purge/yahs/autohic 只跑一次, 异源多倍体本项目用)
#   diploid = hap1/hap2 分相双链 (原版 colora; 注意与 include_purge_dups 组合仅支持非分相组装)
downstream_mode: "primary"

# Customisable parameters for hifiasm
hifiasm:
  phased_assembly: True # set to true if you want to obtain a phased assembly
  optional_params:
    "-f": false # used for small datasets
    "-l": "3" # purge level. 0: no purging; 1: light; 2/3: aggressive [0 for trio; 3 for unzip]
    "--n-hap": "4" # 倍性，纯 hifi 模式分相
    "--hom-cov": "66" # 4n 峰 coverage（纯合峰）
    "-s": "0.2" # 降低相似度阈值，更激进 purge（默认 -l3 为 0.55）

#Set this to False if you want to skip the fcsgx step:
include_fcsgx: False #inlcude this rule only if you have previously downloaded the database (recommended to run fcsgx only on a HPC. It requires around 500 GB of space on your disk and a large RAM)

# Customisable parameters for fcsgx
fcsgx:
  ncbi_tax_id: 318046 
  path_to_gx_db: "resources/gxdb"

# Set this to False if you want to skip purge_dups steps:
include_purge_dups: True

# Customisable parameters for arima mapping pipeline:
arima:
  MAPQ_FILTER: 10

# yahs scaffolding
yahs:
  optional_params:
    "-e": "GATC"  # DpnII 单酶切，辅助挂载

# Customisable parameters for quast
quast:
  optional_params: 
    "--fragmented": ""
    "--large": ""
    "-r": "/home/pkzhu/bamboobase/genome/Phyllostachys_edulis.faa" #reference genome (fasta)
    "-g": "/home/pkzhu/bamboobase/str_ann/Phyllostachys_edulis.gff3" # reference features (gff)

# Customisable parameters for busco
busco:
  lineage: "resources/busco_db/poales_odb12" # lineage to be used for busco analysis
  optional_params:
    "--metaeuk": "" # this can be set to True if needed. The default is miniprot

# AutoHiC (3D-DNA) scaffold 修正 (yahs 之后): matlock mnd → 3D-DNA visualizer .hic
# → AutoHiC 神经网络纠错. 产物为纠错后 out_JBAT.assembly / adjusted.assembly / error_summary.json;
# 后续 Juicebox 手动 review 为交互步骤, 在流程外进行.
include_autohic: True

autohic:
  autohic_dir: "/home/pkzhu/software/AutoHiC" # AutoHiC 仓库 (onehic.py 所在)
  model: "/home/pkzhu/software/AutoHiC/src/models/cfgs/error_model.pth" # 预训练纠错模型
  visualizer: "/home/pkzhu/software/AutoHiC_pretrained/3d-dna/3d-dna/visualize/run-assembly-visualizer.sh" # 3D-DNA run-assembly-visualizer.sh
